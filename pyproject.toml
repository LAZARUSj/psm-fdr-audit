[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psm-fdr-audit"
version = "0.1.0"
description = "Small, auditable target-decoy FDR experiments for proteomics PSM scores."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Wenjie Zhang"}]
keywords = [
  "proteomics",
  "mass spectrometry",
  "target-decoy competition",
  "false discovery rate",
  "benchmarking",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
psm-fdr-audit = "psm_fdr_audit.cli:main"

[project.urls]
Repository = "https://github.com/LAZARUSj/psm-fdr-audit"
Issues = "https://github.com/LAZARUSj/psm-fdr-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/psm_fdr_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
